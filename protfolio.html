    <h2>Video Slider</h2>

    <div class="slider">
        <video id="videoPlayer" controls>
            <source src="nepal.mp4" type="video/mp4">
        </video>

        <div class="buttons">
            <button onclick="prevVideo()">⏮ Prev</button>
            <button onclick="nextVideo()">Next ⏭</button>
        </div>
    </div>

    <script>
        const videos = ["nepal.mp4", "culture.mp4"];
        let index = 0;

        function showVideo() {
            const player = document.getElementById("videoPlayer");
            player.src = videos[index];
            player.load();
            player.play();
        }

        function nextVideo() {
            index = (index + 1) % videos.length;
            showVideo();
        }

        function prevVideo() {
            index = (index - 1 + videos.length) % videos.length;
            showVideo();
        }
    </script>
